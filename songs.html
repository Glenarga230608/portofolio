<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagu Favorit — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #000;
      color: #F3F4F6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .notes-layer {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .note {
      position: absolute; bottom: -40px;
      animation: note-drift linear infinite;
      text-shadow: 0 0 8px rgba(255,255,255,0.35);
    }
    .note.n0 { color: #e9d5ff; }
    .note.n1 { color: #bfdbfe; }
    .note.n2 { color: #fbcfe8; }
    .note.n3 { color: #a7f3d0; }
    .note.n4 { color: #fde68a; }
    .note.n5 { color: #ddd6fe; }
    @keyframes note-drift {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      8%   { opacity: 1; }
      50%  { transform: translate(40px, -50vh) rotate(180deg); }
      92%  { opacity: 0.8; }
      100% { transform: translate(-20px, -110vh) rotate(360deg); opacity: 0; }
    }

    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.15rem;
      background: rgba(0,0,0,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .topbar a {
      color: #E5E5E5; text-decoration: none; font-weight: 600; font-size: 0.9rem;
      display: inline-flex; align-items: center; gap: 0.4rem;
    }

    .header {
      position: relative; z-index: 2;
      text-align: center;
      padding: 2.25rem 1rem 1.25rem;
    }
    .label-3d {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-size: clamp(1.1rem, 4.5vw, 1.75rem);
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #E9D5FF;
      text-shadow: 0 1px 0 #c4b5fd, 0 2px 0 #a78bfa, 0 3px 0 #8b5cf6, 0 4px 0 #7c3aed, 0 6px 12px rgba(91,33,182,0.55);
      animation: label-wave 3.2s ease-in-out infinite;
      margin-bottom: 0.85rem;
    }
    @keyframes label-wave {
      0%   { transform: scaleX(0.88) translateX(-6px); letter-spacing: 0.18em; }
      40%  { transform: scaleX(1.12) translateX(4px); letter-spacing: 0.35em; }
      70%  { transform: scaleX(1.02) translateX(2px); letter-spacing: 0.28em; }
      100% { transform: scaleX(0.88) translateX(-6px); letter-spacing: 0.18em; }
    }
    .title-3d {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(1.85rem, 6vw, 3rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 0 #ddd6fe, 0 2px 0 #c4b5fd, 0 3px 0 #a78bfa, 0 4px 0 #8b5cf6, 0 5px 0 #7c3aed, 0 10px 20px rgba(0,0,0,0.55);
      animation: title-float 4s ease-in-out infinite;
    }
    @keyframes title-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .sub { margin-top: 0.75rem; color: #A1A1AA; font-size: 0.9rem; }

    .grid {
      position: relative; z-index: 2;
      max-width: 1100px; margin: 0 auto;
      padding: 1rem 1rem 3rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.5rem 1.2rem;
      justify-items: center;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1.75rem 1.4rem; }
    }

    .song-card {
      width: 100%;
      max-width: 180px;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    .float-a { animation-name: float-a; }
    .float-b { animation-name: float-b; }
    .float-c { animation-name: float-c; }
    .float-d { animation-name: float-d; }
    .float-e { animation-name: float-e; }
    .float-f { animation-name: float-f; }
    @keyframes float-a {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes float-b {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-8px) translateX(5px); }
    }
    @keyframes float-c {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes float-d {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.03); }
    }
    @keyframes float-e {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(5px, -9px); }
      66% { transform: translate(-4px, -5px); }
    }
    @keyframes float-f {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-11px); }
    }

    .vinyl-wrap {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 50% 50%,
          #1a1a1a 0%,
          #111 28%,
          #0a0a0a 29%,
          #151515 30%,
          #0d0d0d 42%,
          #181818 43%,
          #0a0a0a 55%,
          #141414 56%,
          #080808 70%,
          #121212 71%,
          #050505 100%);
      box-shadow:
        0 0 0 3px #222,
        0 8px 24px rgba(0,0,0,0.7),
        inset 0 0 30px rgba(0,0,0,0.8);
      animation: spin-vinyl linear infinite;
    }
    @keyframes spin-vinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .song-card:hover .vinyl {
      animation-play-state: paused;
    }

    .vinyl-grooves {
      position: absolute;
      inset: 6%;
      border-radius: 50%;
      background:
        repeating-radial-gradient(
          circle at center,
          transparent 0px,
          transparent 3px,
          rgba(255,255,255,0.035) 3px,
          rgba(255,255,255,0.035) 4px
        );
      pointer-events: none;
    }

    /* circular title text */
    .vinyl-text-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }
    .curved-text {
      fill: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .vinyl-label {
      position: absolute;
      top: 50%; left: 50%;
      width: 28%;
      height: 28%;
      margin: -14% 0 0 -14%;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--c1), var(--c2));
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.45),
        inset 0 2px 6px rgba(255,255,255,0.15);
      z-index: 3;
    }

    .vinyl-hole {
      position: absolute;
      top: 50%; left: 50%;
      width: 7%;
      height: 7%;
      margin: -3.5% 0 0 -3.5%;
      border-radius: 50%;
      background: #000;
      box-shadow: inset 0 0 0 1.5px #333, 0 0 4px #000;
      z-index: 4;
    }

    .footer {
      position: relative; z-index: 2;
      text-align: center; padding: 1rem;
      font-size: 0.78rem; color: #52525B;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>
